<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="가온길 에듀 계열 선택형 탐구주제 탐색 시스템. 키워드 기반 다중 자료 검색, KCI 공식 검색, 선택 주제 펼쳐보기를 지원합니다.">
<meta name="author" content="가온길 에듀 입시전략연구소">
<title>가온길 에듀 탐구주제 설정</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/app.css?v=20260720-v6">
<link rel="stylesheet" href="../assets/css/gaongil-dark-shell.css">
<link rel="stylesheet" href="../assets/css/gaongil-menu-final.css?v=20260712-mobile-overlay" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <a class="logoBox" href="./index.html" aria-label="가온길 에듀 탐구주제 홈">
      <img src="./assets/gaongil-logo.png" alt="가온길 에듀" onerror="this.style.display='none';this.parentElement.classList.add('logoFallback')">
      <span class="logoText">GAONGIL EDU</span>
    </a>
    <div class="brandGroup">
      <div class="brandKicker">GAONGIL EDU RESEARCH</div>
      <div class="brandTitle">계열 선택형 탐구주제 설정</div>
      <div class="brandSub">진로 계열을 선택한 뒤, 교과·과목·영역·탐구주제를 단계별로 탐색하세요.</div>
    </div>
    <div class="topActions">
      <a class="badge" href="../index.html" style="text-decoration:none">← 가온길 에듀 홈</a>
      <span class="badge gold">7개 계열</span>
      <span class="badge">총 3,866개 탐구주제</span>
      <button class="selectedTopBtn" id="selectedOpenBtn" type="button">🗂 선택한 주제 <span class="selectedCount" id="selectedCount">0</span></button>
    </div>
  </header>
  <div class="shell">
    <aside class="rail">
      <h2 class="railTitle">계열 바로가기</h2>
      <div class="navList" id="navList"></div>
      <div class="guide">
        <div class="guideTitle">사용 순서</div>
        <ol>
          <li>계열을 선택합니다.</li>
          <li>교과 → 과목 → 영역을 고릅니다.</li>
          <li>주제를 선택하고 ‘선택 담기’를 누릅니다.</li>
          <li>상단 ‘선택한 주제’에서 한꺼번에 확인합니다.</li>
        </ol>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>
</div>
<div class="modalBackdrop" id="selectedModal" aria-hidden="true">
  <section class="selectedDrawer" role="dialog" aria-modal="true" aria-labelledby="selectedDrawerTitle">
    <header class="drawerHead">
      <div><div class="drawerTitle" id="selectedDrawerTitle">선택한 탐구주제</div><div class="drawerSub" id="selectedDrawerSub">선택한 주제를 계열별로 모아봅니다.</div></div>
      <button class="drawerClose" id="selectedCloseBtn" type="button" aria-label="닫기">×</button>
    </header>
    <div class="drawerBody" id="selectedDrawerBody"></div>
    <footer class="drawerFoot">
      <button class="backBtn" id="copySelectedBtn" type="button">목록 복사</button>
      <button class="backBtn" id="printSelectedBtn" type="button">인쇄</button>
      <button class="resetBtn" id="clearSelectedBtn" type="button">전체 비우기</button>
    </footer>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="./assets/data.js?v=20260720-v6"></script>
<script src="./assets/app.js?v=20260720-v6"></script>
<script src="../assets/js/auth.js?v=20260713-firebase-google"></script>
<script>
  (async () => {
    await GaongilAuth.ensureSeedUsers();
    GaongilAuth.requirePageAccess("../login.html");
  })();
</script>
<script src="../assets/js/gaongil-dark-shell.js" defer></script>
<script src="../portal-menu-v2.js?v=20260721b"></script>
</body>
</html>
